name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # better-sqlite3 >=13 requires Node >=22 (see package.json engines) —
        # test the two most recent 22.x/24.x LTS-track lines, not 20.x.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run fast evolutionary simulation smoke test
        run: node src/index.js --simulate=20 --seed=ci-smoke-test
