<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iaADN — Hive Mind Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --text-dim: #888898;
      --accent: #6c5ce7;
      --accent2: #a29bfe;
      --green: #00b894;
      --red: #e17055;
      --orange: #fdcb6e;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.4em;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-bar {
      display: flex;
      gap: 16px;
      margin-left: auto;
      font-size: 0.82em;
      color: var(--text-dim);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.red { background: var(--red); }
    .dot.orange { background: var(--orange); }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h3 {
      padding: 14px 16px 8px;
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .instance-card {
      margin: 4px 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.82em;
    }

    .instance-card .id {
      font-family: 'Consolas', monospace;
      color: var(--accent2);
      font-size: 0.9em;
    }

    .instance-card .meta {
      color: var(--text-dim);
      margin-top: 4px;
      display: flex;
      gap: 10px;
    }

    .fitness-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .fitness-bar .fill {
      height: 100%;
      border-radius: 2px;
      background: var(--green);
      transition: width 0.3s;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.92em;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message .msg-meta {
      font-size: 0.75em;
      color: var(--text-dim);
      margin-top: 6px;
      opacity: 0.7;
    }

    .message.ai .msg-meta { color: var(--text-dim); }
    .message.user .msg-meta { color: rgba(255,255,255,0.6); }

    .message.system {
      align-self: center;
      background: none;
      color: var(--text-dim);
      font-size: 0.82em;
      font-style: italic;
      padding: 4px;
    }

    .typing {
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      display: none;
    }

    .typing.active { display: flex; gap: 4px; align-items: center; }

    .typing span {
      width: 7px; height: 7px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-area textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92em;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
    }

    .input-area textarea:focus {
      border-color: var(--accent);
    }

    .input-area button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 0.92em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-area button:hover { background: var(--accent2); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* API token form — shown until a valid token is entered */
    .input-area input {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92em;
      outline: none;
    }
    .input-area input:focus { border-color: var(--accent); }
    [hidden] { display: none !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">iaADN</div>
  <span style="color: var(--text-dim); font-size: 0.85em;">Hive Mind</span>
  <div class="status-bar">
    <div class="status-item">
      <span class="dot green" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
    <div class="status-item" id="popCount">Pop: --</div>
    <div class="status-item" id="inferenceStatus">Inference: --</div>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <h3>Population</h3>
    <div id="instanceList"></div>
    <h3 style="margin-top:16px">Lineage</h3>
    <div id="lineageStats" class="instance-card" style="color: var(--text-dim); font-size: 0.8em;">
      Loading...
    </div>
    <h3 style="margin-top:16px">Fitness over time</h3>
    <svg id="fitnessChart" viewBox="0 0 200 60" preserveAspectRatio="none"
      style="width:100%;height:60px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;"></svg>
    <div style="font-size:0.72em;color:var(--text-dim);margin-top:4px;">
      <span style="color:#888898;">— avg</span> &nbsp; <span style="color:#a29bfe;">— best</span>
    </div>
  </aside>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="message system">Connected to iaADN Hive Mind. Type a message to begin.</div>
    </div>
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
    <form class="input-area" id="tokenForm" hidden>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="API token (node src/index.js --show-token)" aria-label="API token">
      <button type="submit">Connect</button>
    </form>
    <div class="input-area" id="chatForm">
      <textarea id="input" rows="1" placeholder="Send a message to the hive mind..." autofocus></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typingEl = document.getElementById('typing');
const tokenForm = document.getElementById('tokenForm');
const tokenInput = document.getElementById('tokenInput');
const chatForm = document.getElementById('chatForm');

// --- API token (kept in this browser only; storage may be unavailable) ---
const TOKEN_KEY = 'iaadn.apiToken';
let apiToken = null;
try { apiToken = localStorage.getItem(TOKEN_KEY); } catch {}

function setToken(value) {
  apiToken = value;
  try {
    if (value) localStorage.setItem(TOKEN_KEY, value);
    else localStorage.removeItem(TOKEN_KEY);
  } catch {}
}

function showTokenForm(reason) {
  // Several polls can 401 at once — only announce it the first time
  if (!tokenForm.hidden) reason = null;
  setToken(null);
  chatForm.hidden = true;
  tokenForm.hidden = false;
  document.getElementById('statusDot').className = 'dot orange';
  document.getElementById('statusText').textContent = 'Token required';
  if (reason) addMessage(reason, 'system');
  tokenInput.focus();
}

function showChat() {
  tokenForm.hidden = true;
  chatForm.hidden = false;
  inputEl.focus();
}

tokenForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const value = tokenInput.value.trim();
  if (!value) return;
  tokenInput.value = '';
  setToken(value);
  showChat();
  refreshStatus();
  refreshLineage();
  refreshGenerations();
});

class UnauthorizedError extends Error {}

// fetch() with the bearer token; a 401 drops the token and asks again
async function apiFetch(path, options = {}) {
  if (!apiToken) throw new UnauthorizedError('No token');
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${apiToken}` },
  });
  if (res.status === 401) {
    showTokenForm('Invalid or missing API token. Enter it again.');
    throw new UnauthorizedError('Unauthorized');
  }
  if (res.status === 429) {
    const wait = res.headers.get('Retry-After') || '60';
    throw new Error(`Too many requests — try again in ${wait}s`);
  }
  return res;
}

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Enter to send (Shift+Enter for newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addMessage(text, type, meta) {
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  if (meta) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';
    metaDiv.textContent = meta;
    div.appendChild(metaDiv);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage(text, 'user');
  typingEl.classList.add('active');

  try {
    const res = await apiFetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    const data = await res.json();

    if (data.error) {
      addMessage(data.error, 'system');
    } else {
      const meta = data.metadata
        ? `${data.metadata.mode || data.metadata.decomposition || ''} | ${data.metadata.elapsed ? data.metadata.elapsed + 'ms' : ''} | instances: ${data.metadata.instancesUsed ?? '?'}`
        : '';
      addMessage(data.response, 'ai', meta);
    }
  } catch (err) {
    if (!(err instanceof UnauthorizedError)) {
      addMessage(`Connection error: ${err.message}`, 'system');
    }
  }

  typingEl.classList.remove('active');
  sendBtn.disabled = false;
  inputEl.focus();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// The API sends specialization as { domain: weight }; show the strongest one
function topSpecialization(spec) {
  if (!spec || typeof spec !== 'object') return 'general';
  let best = 'general';
  let bestWeight = -Infinity;
  for (const [domain, weight] of Object.entries(spec)) {
    if (typeof weight === 'number' && weight > bestWeight) {
      best = domain;
      bestWeight = weight;
    }
  }
  return bestWeight === -Infinity ? 'general' : `${best} ${bestWeight.toFixed(2)}`;
}

// Poll status
async function refreshStatus() {
  if (!apiToken) return;
  try {
    const res = await apiFetch('/api/status');
    const data = await res.json();

    document.getElementById('statusDot').className = 'dot green';
    document.getElementById('statusText').textContent = data.nodeId?.slice(0, 12) || 'Online';
    document.getElementById('popCount').textContent = `Pop: ${data.population ?? 0}`;
    document.getElementById('inferenceStatus').textContent = `Inference: ${data.inferenceReady ? 'Ready' : 'Offline'}`;

    // Render instances (built with textContent — no server data goes through innerHTML)
    const listEl = document.getElementById('instanceList');
    listEl.replaceChildren();
    if (data.instances && data.instances.length > 0) {
      for (const inst of data.instances) {
        const card = el('div', 'instance-card');
        card.append(el('div', 'id', inst.id?.slice(0, 20) || '?'));
        const meta = el('div', 'meta');
        meta.append(
          el('span', null, `Gen ${inst.generation ?? '?'}`),
          el('span', null, topSpecialization(inst.specialization)),
          el('span', null, `F: ${typeof inst.fitness === 'number' ? inst.fitness.toFixed(2) : '?'}`),
        );
        card.append(meta);
        const bar = el('div', 'fitness-bar');
        const fill = el('div', 'fill');
        const pct = Math.max(0, Math.min(100, (Number(inst.fitness) || 0) * 100));
        fill.style.width = `${pct.toFixed(0)}%`;
        bar.append(fill);
        card.append(bar);
        listEl.append(card);
      }
    } else {
      const empty = el('div', 'instance-card', 'No instances');
      empty.style.color = 'var(--text-dim)';
      listEl.append(empty);
    }
  } catch (err) {
    if (err instanceof UnauthorizedError) return;
    const limited = err.message.startsWith('Too many requests');
    document.getElementById('statusDot').className = limited ? 'dot orange' : 'dot red';
    document.getElementById('statusText').textContent = limited ? 'Rate limited' : 'Disconnected';
  }
}

async function refreshLineage() {
  if (!apiToken) return;
  try {
    const res = await apiFetch('/api/lineage');
    const data = await res.json();
    const s = data.stats || {};
    // Field names match Lineage.getStats() in src/genome/lineage.js
    const lines = [
      `Total births: ${s.total ?? 0}`,
      `Total deaths: ${s.dead ?? 0}`,
      `Living: ${s.living ?? 0}`,
      `Max generation: ${s.currentGeneration ?? 0}`,
    ];
    const box = document.getElementById('lineageStats');
    box.replaceChildren();
    lines.forEach((line, i) => {
      if (i > 0) box.append(document.createElement('br'));
      box.append(line);
    });
  } catch {
    document.getElementById('lineageStats').textContent = 'Unavailable';
  }
}

const SVG_NS = 'http://www.w3.org/2000/svg';

async function refreshGenerations() {
  if (!apiToken) return;
  try {
    const res = await apiFetch('/api/generations?limit=50');
    const data = await res.json();
    renderFitnessChart(data.generations || []);
  } catch {
    // leave whatever was last drawn — a blank chart isn't worth a message
  }
}

// Draws avg/best fitness per generation as two polylines. Built with SVG DOM
// nodes (not innerHTML) so server-provided numbers never touch markup.
function renderFitnessChart(generations) {
  const svg = document.getElementById('fitnessChart');
  svg.replaceChildren();
  if (generations.length < 2) return;

  const width = 200, height = 60, pad = 4;
  const stepX = (width - pad * 2) / (generations.length - 1);
  const toY = (v) => height - pad - (Math.max(0, Math.min(1, Number(v) || 0)) * (height - pad * 2));

  const line = (key, color) => {
    const points = generations
      .map((g, i) => `${(pad + i * stepX).toFixed(1)},${toY(g[key]).toFixed(1)}`)
      .join(' ');
    const el = document.createElementNS(SVG_NS, 'polyline');
    el.setAttribute('points', points);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', color);
    el.setAttribute('stroke-width', '1.5');
    return el;
  };

  svg.append(line('avgFitness', '#888898'), line('bestFitness', '#a29bfe'));
}

// Initial load + polling
if (apiToken) showChat(); else showTokenForm();
refreshStatus();
refreshLineage();
refreshGenerations();
setInterval(refreshStatus, 5000);
setInterval(refreshLineage, 15000);
setInterval(refreshGenerations, 15000);
</script>

</body>
</html>
